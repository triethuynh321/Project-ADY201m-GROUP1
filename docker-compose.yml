services:
  minio:
    image: minio-local:latest
    container_name: local_minio

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: dat666
      MINIO_ROOT_PASSWORD: "dat@123456"

    command: server /data --console-address ":9001"

    volumes:
      - ./data/minio_storage:/data
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: dat666
      POSTGRES_PASSWORD: dat@123456
      POSTGRES_DB: gmaps_reviews_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: